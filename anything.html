<!DOCTYPE html>
<html>
<body>
    <div id="ingredients"></div>

    <script>
        tinola = ["chicken", "ginger", "garlic", "onion", "pepper", "fish sauce", "green papaya", "spinach"];

        for (let i = 0; i < tinola.length; i++) {
            document.getElementById("ingredients").innerHTML += tinola[i] + "<br>"; 
        }
    </script>
</body>
</html>
