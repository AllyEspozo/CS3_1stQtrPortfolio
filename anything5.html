<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wordle Lite</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121213;
      color: #ffffff;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #d7dadc;
    }

    #wordDisplay {
      font-size: 1.2em;
      margin-bottom: 15px;
      color: #818384;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 1em;
      width: 120px;
      text-transform: uppercase;
      background-color: #3a3a3c;
      color: white;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 1em;
      background-color: #538d4e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #6aaa64;
    }

    #results {
      margin-top: 20px;
    }

    .tile {
      display: inline-block;
      width: 40px;
      height: 40px;
      line-height: 40px;
      margin: 2px;
      font-size: 1.5em;
      font-weight: bold;
      border-radius: 5px;
    }

    .green {
      background-color: #6aaa64;
      color: white;
    }

    .yellow {
      background-color: #c9b458;
      color: black;
    }

    .gray {
      background-color: #3a3a3c;
      color: white;
    }
  </style>
</head>
<body>

  <h1>Wordle Lite</h1>
  <p id="wordDisplay">Guess the 5-letter word!</p>
  <input type="text" id="guessInput" maxlength="5">
  <button onclick="makeGuess()">Guess</button>
  <div id="results"></div>

  <script>
    const secretWord = "shoot";
    const maxAttempts = 6;
    let attempts = 0;

    function makeGuess() {
      const guess = document.getElementById("guessInput").value.toLowerCase();
      if (guess.length !== 5 || attempts >= maxAttempts) return;

      let resultRow = "";
      for (let i = 0; i < 5; i++) {
        let className = "gray";
        if (guess[i] === secretWord[i]) {
          className = "green";
        } else if (secretWord.includes(guess[i])) {
          className = "yellow";
        }
        resultRow += `<span class="tile ${className}">${guess[i]}</span>`;
      }

      document.getElementById("results").innerHTML += `<div>${resultRow}</div>`;
      document.getElementById("guessInput").value = "";
      attempts++;

      if (guess === secretWord) {
        document.getElementById("wordDisplay").textContent = "🎉 You guessed it!";
      } else if (attempts === maxAttempts) {
        document.getElementById("wordDisplay").textContent = `😢 Out of tries! The word was "${secretWord}".`;
      }
    }
  </script>

</body>
</html>
